name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.20"
  UV_HTTP_TIMEOUT: "120"

jobs:
  python:
    name: Python lint, types, and tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BACKEND_REDIS_URL: redis://localhost:6379/0
      BACKEND_REDIS_REQUIRED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.21"
          enable-cache: true

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit --progress-spinner off --skip-editable

      - name: Lint Python
        run: uv run ruff check backend tests

      - name: Type-check Python
        run: uv run mypy backend

      - name: Run Python tests
        run: uv run pytest -q

      - name: Validate OpenAPI contract
        shell: bash
        run: |
          uv run python - <<'PY'
          from backend.main import app

          schema = app.openapi()
          required_paths = {
              "/api/v1/health/live",
              "/api/v1/health/ready",
              "/api/v1/dashboard",
          }
          missing = required_paths.difference(schema["paths"])
          if missing:
              raise SystemExit(f"OpenAPI contract is missing paths: {sorted(missing)}")
          if not schema.get("components", {}).get("schemas"):
              raise SystemExit("OpenAPI contract has no component schemas")
          PY

  frontend:
    name: Frontend lint, types, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npx tsc -b --pretty false

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  containers:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    needs: [python, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and web images
        run: docker compose build --pull

      - name: Start stack and await health checks
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      - name: Smoke-test web, SPA fallback, and proxied API
        run: |
          curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8080/nearby
          curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8080/api/v1/health/live

      - name: Print container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
