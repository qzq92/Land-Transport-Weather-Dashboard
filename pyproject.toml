[project]
name = "lta-transport-dashboard"
version = "1.0.0"
description = "React and FastAPI dashboard for Singapore transport, weather, and environmental data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "pydantic-settings>=2.6.0,<3.0",
    "redis>=5.2.0,<7.0",
    "uvicorn[standard]>=0.32.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "conf"]

[tool.hatch.build.targets.sdist]
include = [
    "/backend",
    "/conf",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "mypy>=1.18.2",
    "pip-audit>=2.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.7",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend", "conf", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
packages = ["backend", "conf"]
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B105"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

